[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freecad-mcp-server"
version = "1.1.2"
description = "MCP Server for FreeCAD with Sketcher, Part, and PartDesign tools"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = [
    "mcp[cli]>=2.3.0,<3",
]

[project.scripts]
freecad-mcp = "freecad_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freecad_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"freecad_addon" = "freecad_mcp/_addon"
